{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Amled | Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="container">

    <div class="left">
        <h1>Amled</h1>
    </div>

    <div class="right">
        <div class="login-card">

            {% if form.errors %}
                <p class="error">Usuário ou senha inválidos</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <input
                    type="text"
                    name="username"
                    placeholder="Login"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Senha"
                    required
                >

                <button type="submit">Entrar</button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
